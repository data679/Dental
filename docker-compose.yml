# Local dev dependencies only — Postgres + Redis, matching backend/.env.example.
# Not for production use. Run: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental
    ports:
      - "5432:5432"
    volumes:
      - dental_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dental_pg_data:
