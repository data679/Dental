# Deploys the backend-free demo of the dashboard to GitHub Pages on every push to main.
# The page computes its numbers in the browser from frontend/public/data/snapshot.json
# (synthetic data; regenerate with `npm run snapshot` in backend/ and commit the file).
#
# The configure-pages step enables Pages (source: GitHub Actions) on first run, so no
# manual repo setting is needed; it requires the repo to be public or on a paid plan.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages (idempotent)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build (static snapshot mode)
        working-directory: frontend
        env:
          VITE_STATIC_SNAPSHOT: "true"
          # Project site → served from https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          test -f public/data/snapshot.json || { echo "frontend/public/data/snapshot.json is missing — run 'npm run snapshot' in backend/ and commit it"; exit 1; }
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
